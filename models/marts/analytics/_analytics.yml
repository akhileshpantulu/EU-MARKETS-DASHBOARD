version: 2

models:
  - name: mart_country_monthly
    description: Every monthly country series side by side (drill-across). Grain geo x month.
    tests:
      - unique_combination: {combination_of_columns: [geo_code, date_key]}
    columns:
      - name: foreign_share
        tests:
          - between: {min_value: 0, max_value: 1.01}
      - name: avg_length_of_stay
        description: Nights per arrival. Small markets in lockdown months can fall outside the usual 1-15 range.
        tests:
          - between:
              min_value: 0.5
              max_value: 60
              config: {severity: warn}

  - name: mart_country_annual
    tests:
      - unique_combination: {combination_of_columns: [geo_code, year]}
    columns:
      - name: high_season_share
        tests:
          - between: {min_value: 0, max_value: 1}
      - name: peak_two_month_share
        tests:
          - between: {min_value: 0, max_value: 1}
      - name: platform_share
        tests:
          - between: {min_value: 0, max_value: 1}

  - name: mart_country_scorecard
    columns:
      - name: is_current
        description: Latest month of nights is within twelve months of the newest month any market has.
        tests: [not_null]
      - name: geo_code
        tests: [unique, not_null]

  - name: mart_region_annual
    tests:
      - unique_combination: {combination_of_columns: [geo_code, year]}
    columns:
      - name: peak_two_month_share
        tests:
          - between: {min_value: 0, max_value: 1}
      - name: foreign_share
        tests:
          - between: {min_value: 0, max_value: 1.01}

  - name: mart_region_monthly
    tests:
      - unique_combination: {combination_of_columns: [geo_code, date_key]}

  - name: mart_source_markets
    tests:
      - unique_combination: {combination_of_columns: [geo_code, partner_code, year]}
    columns:
      - name: share_of_foreign_nights
        tests:
          - between: {min_value: 0, max_value: 1.01}

  - name: mart_spain_zone_monthly
    tests:
      - unique_combination: {combination_of_columns: [zone_key, date_key]}

  - name: mart_data_freshness
    columns:
      - name: source_key
        tests: [unique, not_null]

  - name: mart_weather_monthly
    tests:
      - unique_combination: {combination_of_columns: [location_code, date_key]}

  - name: mart_market_demand_monthly
    tests:
      - unique_combination: {combination_of_columns: [market_code, date_key]}

  - name: mart_market_demand_scorecard
    columns:
      - name: market_code
        tests: [unique, not_null]

  - name: mart_airport_summary
    columns:
      - name: airport_code
        tests: [unique, not_null]

  - name: mart_airport_origins
    tests:
      - unique_combination: {combination_of_columns: [airport_code, partner_country_code, year]}
    columns:
      - name: share_of_airport
        tests:
          - between: {min_value: 0, max_value: 1}

  - name: mart_airport_routes
    tests:
      - unique_combination: {combination_of_columns: [airport_code, partner_airport_code, year]}

  - name: mart_portugal_prices_monthly
    tests:
      - unique_combination: {combination_of_columns: [region_code, accommodation_type_code, date_key]}
    columns:
      - name: revenue_per_night_eur
        description: Lodging income / nights. A units slip (INE.pt publishes income in thousands) shows up here.
        tests:
          - between:
              min_value: 10
              max_value: 1000
              config: {severity: error, warn_if: '>0', error_if: '>20'}

  - name: mart_country_annual_history
    description: >
      Annual value and change for every monthly country series. kind: sum (change = % change),
      index (% change of the annual average), rate01 / pct / level (change = difference of annual averages).
    tests:
      - unique_combination: {combination_of_columns: [geo_code, metric, year]}
    columns:
      - name: kind
        tests:
          - accepted_values: {values: [sum, index, rate01, pct, level]}

  - name: mart_airport_annual
    description: Annual passengers per airport since 2005, latest year as YTD.
    tests:
      - unique_combination: {combination_of_columns: [airport_code, year]}
    columns:
      - name: passengers
        tests: [non_negative]
